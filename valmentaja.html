<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101318">
<title>Valmentajanäkymä — Kia Norring Training</title>
<style>
  :root{
    --bg:#101318; --surface:#191e26; --surface2:#222a36; --line:#2b3442;
    --text:#e9ecf1; --muted:#8a94a6; --accent:#ffb454; --accent-ink:#241a08;
    --teal:#4cc9c0; --ok:#4cc38a; --varo:#e5934a; --paha:#e05a6d;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding-bottom:40px;
  }
  header{
    padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 12px;
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;
  }
  .kn{
    width:44px;height:44px;flex:none;border:2px solid var(--accent);border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    font:700 17px "Avenir Next Condensed","Arial Narrow",sans-serif;color:var(--accent);
  }
  header h1{margin:0;font:700 20px "Avenir Next Condensed","Arial Narrow",sans-serif;
    text-transform:uppercase;letter-spacing:.06em}
  header .sub{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
  header .who{margin-left:auto;text-align:right;font-size:12px;color:var(--muted)}
  header .who a{color:var(--muted)}
  main{max-width:760px;margin:0 auto;padding:16px}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin:12px 0;
  }
  h2{font:700 18px "Avenir Next Condensed","Arial Narrow",sans-serif;
    text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px}
  h3{font-size:16px;margin:0 0 6px}
  .muted{color:var(--muted);font-size:13px}
  input,select,textarea,button{font:inherit;border-radius:10px}
  input,textarea,select{
    background:var(--surface2);border:1px solid var(--line);color:var(--text);
    padding:10px 12px;width:100%;font-size:16px;
  }
  textarea{resize:vertical}
  button.primary{
    background:var(--accent);color:var(--accent-ink);border:0;font-weight:700;
    padding:11px 18px;cursor:pointer;width:100%;
  }
  button.ghost{
    background:none;border:1px solid var(--line);color:var(--text);
    padding:9px 14px;cursor:pointer;
  }
  button:disabled{opacity:.5}
  .rivi{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tila{
    font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;
    border:1px solid var(--line);color:var(--muted);white-space:nowrap;
  }
  .tila.aktiivinen{color:var(--ok);border-color:var(--ok)}
  .tila.kutsuttu{color:var(--accent);border-color:var(--accent)}
  .tila.tauolla{color:var(--varo);border-color:var(--varo)}
  .tila.paattynyt{color:var(--paha);border-color:var(--paha)}
  .asiakas{
    width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px 16px;margin:8px 0;cursor:pointer;
    display:flex;align-items:center;gap:10px;color:var(--text);
  }
  .asiakas:hover{border-color:var(--accent)}
  .asiakas .nimi{font-weight:600}
  .asiakas .em{font-size:12px;color:var(--muted)}
  .viikkonav{display:flex;align-items:center;gap:10px;margin:14px 0 6px}
  .viikkonav h3{flex:1;text-align:center;margin:0}
  .paiva{border-top:1px solid var(--line);padding:10px 0}
  .paiva:first-of-type{border-top:0}
  .paiva .pv{font-weight:600;font-size:14px}
  .liike{font-size:13px;color:var(--muted);margin-left:12px}
  .liike b{color:var(--text);font-weight:600}
  .feel-tag{font-size:12px;border-radius:999px;padding:1px 8px;border:1px solid var(--line)}
  .feel-kevyt{color:var(--ok);border-color:var(--ok)}
  .feel-sopiva{color:#5b9dd9;border-color:#5b9dd9}
  .feel-raskas{color:var(--varo);border-color:var(--varo)}
  .feel-eraskas{color:var(--paha);border-color:var(--paha)}
  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
  .stat{background:var(--surface2);border-radius:10px;padding:8px;text-align:center}
  .stat b{display:block;font-size:20px;color:var(--accent)}
  .stat span{font-size:11px;color:var(--muted)}
  .kommentti{background:var(--surface2);border-radius:10px;padding:10px 12px;margin:8px 0}
  .kommentti .aika{font-size:11px;color:var(--muted)}
  .kevennys{background:#3a2c14;border:1px solid var(--accent);color:var(--accent);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}
  .kevennys.pois{background:var(--surface2);border-color:var(--line);color:var(--muted)}
  .siirto{padding:6px 0;border-top:1px solid var(--line);font-size:13px}
  .lihasrivi{display:flex;align-items:center;gap:8px;font-size:13px;margin:3px 0}
  .lihasrivi .ln{width:96px;flex:none}
  .lihasrivi .lb{flex:1;height:10px;background:var(--surface2);border-radius:5px;position:relative;overflow:hidden}
  .lihasrivi .ls,.lihasrivi .lt{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
  .lihasrivi .ls{background:var(--line)}
  .lihasrivi .lt{background:var(--accent)}
  .lihasrivi .lv{width:78px;flex:none;text-align:right;color:var(--muted)}
  .liike.puuttuu b{color:var(--muted)}
  .eikirjattu{color:var(--paha)}
  .vajaa{color:var(--varo)}
  .liike{margin-top:4px}
  details.ohj summary{cursor:pointer;color:var(--accent);font-size:14px;margin-top:10px}
  #toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--surface2);border:1px solid var(--line);color:var(--text);
    padding:8px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;
    pointer-events:none;z-index:40;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:520px){ .statgrid{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<header>
  <div class="kn">KN</div>
  <div>
    <h1>Valmentajanäkymä</h1>
    <div class="sub">Kia Norring Training</div>
  </div>
  <div class="who" id="who"></div>
</header>
<main id="view"><div class="card muted">Ladataan…</div></main>
<div id="toast"></div>

<script>
'use strict';
/* ============ Supabase-kytkentä (sama sessio kuin sovelluksella) ============ */
const SB_URL='https://iroupwdszrboyjysjjcq.supabase.co';
const SB_KEY='sb_publishable_Ud9cZaeyQ8TRth-_ALwvmA_PBlZmzGi';
let sbSession=null;
let minaProfiili=null;

function loadAuth(){ try{ sbSession=JSON.parse(localStorage.getItem('tpk_auth'))||null; }catch(e){ sbSession=null; } }
function saveAuth(){ if(sbSession) localStorage.setItem('tpk_auth', JSON.stringify(sbSession)); else localStorage.removeItem('tpk_auth'); }
function sbHeaders(){ return { apikey:SB_KEY, Authorization:'Bearer '+sbSession.access_token, 'Content-Type':'application/json' }; }
function cloudOn(){ return !!(sbSession && sbSession.user && sbSession.user.id); }

function handleAuthHash(){
  if(location.hash && location.hash.indexOf('access_token=')>=0){
    const p=new URLSearchParams(location.hash.slice(1));
    const at=p.get('access_token'), rt=p.get('refresh_token');
    if(at){ sbSession={access_token:at, refresh_token:rt, user:null}; saveAuth();
      history.replaceState(null,'',location.pathname+location.search); }
  }
}
async function sbSendLink(email){
  const r=await fetch(SB_URL+'/auth/v1/otp?redirect_to='+encodeURIComponent(location.origin+'/valmentaja.html'),{
    method:'POST', headers:{apikey:SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email:email, create_user:true})});
  if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.msg||j.error_description||('HTTP '+r.status)); }
}
/* Asiakkaan kirjautumislinkki ohjaa SOVELLUKSEEN (ei valmentajanäkymään) —
   avaus kirjaa sisään, lunastaa kutsun ja käynnistää pilvisynkan. */
async function lahetaAsiakaslinkki(email){
  const r=await fetch(SB_URL+'/auth/v1/otp?redirect_to='+encodeURIComponent(location.origin+'/'),{
    method:'POST', headers:{apikey:SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email:email, create_user:true})});
  if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.msg||j.error_description||('HTTP '+r.status)); }
}
async function sbRefresh(){
  if(!sbSession||!sbSession.refresh_token) return false;
  try{
    const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST', headers:{apikey:SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:sbSession.refresh_token})});
    if(!r.ok) throw new Error('refresh');
    const j=await r.json();
    sbSession={access_token:j.access_token, refresh_token:j.refresh_token, user:j.user||sbSession.user};
    saveAuth(); return true;
  }catch(e){ sbSession=null; saveAuth(); return false; }
}
async function sbUser(){
  if(!sbSession) return null;
  if(!sbSession.user){
    try{
      const r=await fetch(SB_URL+'/auth/v1/user',{headers:{apikey:SB_KEY,Authorization:'Bearer '+sbSession.access_token}});
      if(r.ok){ sbSession.user=await r.json(); saveAuth(); }
    }catch(e){}
  }
  return sbSession.user;
}
async function apiGet(polku){
  const r=await fetch(SB_URL+'/rest/v1/'+polku,{headers:sbHeaders()});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
async function apiPost(polku, body, extra){
  const r=await fetch(SB_URL+'/rest/v1/'+polku,{
    method:'POST', headers:Object.assign(sbHeaders(),extra||{}), body:JSON.stringify(body)});
  if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.message||('HTTP '+r.status)); }
  return r.status===204?null:r.json().catch(()=>null);
}
async function apiPatch(polku, body){
  const r=await fetch(SB_URL+'/rest/v1/'+polku,{
    method:'PATCH', headers:sbHeaders(), body:JSON.stringify(body)});
  if(!r.ok) throw new Error('HTTP '+r.status);
}

/* ============ Apurit ============ */
const $view=document.getElementById('view');
const FEELN={kevyt:'Kevyt',sopiva:'Sopiva',raskas:'Raskas',eraskas:'Erittäin raskas'};
const SKIPN={sairas:'Sairaana',matka:'Matkoilla',muu:'Muu syy'};
const DAYS=['ma','ti','ke','to','pe','la','su'];
const DOWFULL={ma:'Maanantai',ti:'Tiistai',ke:'Keskiviikko',to:'Torstai',pe:'Perjantai',la:'Lauantai',su:'Sunnuntai'};
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function iso(d){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function fromIso(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=fromIso(s); d.setDate(d.getDate()+n); return iso(d); }
function mondayOf(d){ const x=new Date(d); const wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
function fmtFi(s){ const d=fromIso(s); return d.getDate()+'.'+(d.getMonth()+1)+'.'; }
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800);
}
/* Oma vahvistusmodaali — selaimen confirm() ei näy iOS:n asennetussa PWA:ssa */
function vahvista(viesti, hyvaksyTeksti){
  return new Promise(res=>{
    const o=document.createElement('div');
    o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px';
    o.innerHTML='<div style="background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:420px;width:100%;font-size:15px;box-shadow:0 8px 32px rgba(0,0,0,.5)">'
      +'<div style="white-space:pre-wrap">'+esc(viesti)+'</div>'
      +'<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px">'
      +'<button class="ghost" data-ei>Peruuta</button>'
      +'<button class="primary" style="width:auto" data-ok>'+esc(hyvaksyTeksti||'OK')+'</button></div></div>';
    document.body.appendChild(o);
    o.querySelector('[data-ok]').onclick=()=>{ o.remove(); res(true); };
    o.querySelector('[data-ei]').onclick=()=>{ o.remove(); res(false); };
  });
}

/* Käyttäjähallinta (vain admin): lista + roolin vaihto napista */
async function naytaKayttajat(){
  const os=document.createElement('div');
  os.innerHTML='<h2 style="margin:22px 0 4px">Käyttäjät</h2><div class="card" id="kayttajatlista"><div class="muted">Haetaan…</div></div>';
  $view.appendChild(os);
  const kl=document.getElementById('kayttajatlista');
  let rivit=[];
  try{ rivit=await apiPost('rpc/kayttajalista',{})||[]; }
  catch(e){ kl.innerHTML='<div class="muted">Haku epäonnistui: '+esc(e.message)+'</div>'; return; }
  kl.innerHTML=(rivit.map(k=>{
    const oma=k.id===sbSession.user.id;
    return '<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap">'
      +'<span style="flex:1;min-width:180px"><b>'+esc(k.nimi||k.email)+'</b>'
      +(k.on_admin?' <span class="tila" style="color:var(--teal);border-color:var(--teal)">admin</span>':'')
      +'<br><span class="muted" style="font-size:12px">'+esc(k.email)+' · liittyi '+fmtFi(k.liittyi.slice(0,10))+'</span></span>'
      +'<span class="tila '+(k.rooli==='valmentaja'?'aktiivinen':'')+'">'+esc(k.rooli)+'</span>'
      +(oma?'':'<button class="ghost" style="font-size:13px;padding:6px 10px" data-rooli="'+k.id+'" data-uusi="'+(k.rooli==='valmentaja'?'valmennettava':'valmentaja')+'" data-kuka="'+esc(k.nimi||k.email)+'">'+(k.rooli==='valmentaja'?'Poista valmentajuus':'Tee valmentaja')+'</button>')
      +'</div>';
  }).join('')) || '<div class="muted">Ei käyttäjiä.</div>';
  kl.querySelectorAll('[data-rooli]').forEach(b=>b.onclick=async()=>{
    const ok=await vahvista('Vaihdetaanko käyttäjän '+b.dataset.kuka+' rooliksi "'+b.dataset.uusi+'"?','Vaihda rooli');
    if(!ok) return;
    try{
      await apiPost('rpc/aseta_rooli',{kohde:b.dataset.rooli, uusi:b.dataset.uusi});
      toast('Rooli vaihdettu ✓'); naytaAsiakkaat();
    }catch(e){ toast('Virhe: '+e.message); }
  });
}

/* ============ Näkymät ============ */
let valittu=null;          /* valittu asiakas {id, nimi, email, tila, asiakkuusId} */
let viikkoMon=iso(mondayOf(new Date()));

function naytaKirjautuminen(virhe){
  document.getElementById('who').innerHTML='';
  $view.innerHTML=
    '<div class="card"><h2>Kirjaudu</h2>'
    +(virhe?'<div class="muted" style="color:var(--paha)">'+esc(virhe)+'</div>':'')
    +'<div class="muted" style="margin:6px 0 12px">Saat sähköpostiisi kirjautumislinkin. Sama tunnus toimii sovelluksessa ja valmentajanäkymässä.</div>'
    +'<div class="rivi"><input type="email" id="email" placeholder="sähköposti" autocomplete="email" style="flex:1;min-width:200px">'
    +'<button class="primary" id="btnlogin" style="width:auto">Lähetä linkki</button></div>'
    +'<div class="muted" id="lstatus" style="margin-top:8px"></div></div>';
  document.getElementById('btnlogin').onclick=async()=>{
    const em=document.getElementById('email').value.trim();
    if(!em){ toast('Anna sähköposti'); return; }
    const st=document.getElementById('lstatus');
    try{ await sbSendLink(em); st.textContent='Linkki lähetetty — avaa se tästä selaimesta.'; }
    catch(e){ st.textContent='Lähetys epäonnistui: '+e.message; }
  };
}

function naytaEiOikeuksia(){
  $view.innerHTML='<div class="card"><h2>Ei valmentajaoikeuksia</h2>'
    +'<div class="muted">Tämä näkymä on valmentajille. Olet kirjautunut, mutta tunnuksellasi ei ole valmentajaroolia. '
    +'Sovellus toimii normaalisti osoitteessa <a href="/" style="color:var(--accent)">kianorring.github.io</a>.</div></div>';
}

async function naytaAsiakkaat(){
  valittu=null;
  let asiakkuudet=[], profiilit=[];
  try{
    asiakkuudet=await apiGet('asiakkuudet?select=id,asiakas_id,email,tila,alkoi&order=alkoi.desc');
    profiilit=await apiGet('profiles?select=id,nimi&valmentaja_id=eq.'+sbSession.user.id);
  }catch(e){ $view.innerHTML='<div class="card muted">Lataus epäonnistui: '+esc(e.message)+'</div>'; return; }
  const nimet=Object.fromEntries(profiilit.map(p=>[p.id,p.nimi]));

  let html='<div class="card"><h2>Kutsu uusi asiakas</h2>'
    +'<div class="muted" style="margin:4px 0 10px">Syötä asiakkaan sähköposti — asiakas saa heti kirjautumislinkin sovellukseen, ja linkin avaus liittää hänet sinulle automaattisesti.</div>'
    +'<div class="rivi"><input type="email" id="kutsuemail" placeholder="asiakkaan sähköposti" style="flex:1;min-width:200px">'
    +'<button class="primary" id="btnkutsu" style="width:auto">Kutsu</button></div></div>';

  html+='<h2 style="margin:18px 0 4px">Asiakkaat</h2>';
  if(!asiakkuudet.length) html+='<div class="card muted">Ei vielä asiakkaita. Aloita kutsumalla ensimmäinen.</div>';
  for(const a of asiakkuudet){
    const nimi=a.asiakas_id ? (nimet[a.asiakas_id]||a.email) : a.email;
    html+='<button class="asiakas" data-id="'+a.id+'">'
      +'<span style="flex:1"><span class="nimi">'+esc(nimi)+'</span><br><span class="em">'+esc(a.email)+' · alkaen '+fmtFi(a.alkoi)+'</span></span>'
      +'<span class="tila '+a.tila+'">'+a.tila+'</span></button>';
  }
  $view.innerHTML=html;

  document.getElementById('btnkutsu').onclick=async()=>{
    const em=document.getElementById('kutsuemail').value.trim().toLowerCase().replace(/^mailto:/,'');
    if(!em||!em.includes('@')||/\s/.test(em)){ toast('Tarkista sähköposti'); return; }
    try{
      await apiPost('asiakkuudet',{valmentaja_id:sbSession.user.id, email:em},{Prefer:'return=minimal'});
    }catch(e){ toast(e.message.includes('duplicate')?'Tällä osoitteella on jo kutsu':('Virhe: '+e.message)); return; }
    try{
      await lahetaAsiakaslinkki(em);
      toast('Kutsu tallennettu ja kirjautumislinkki lähetetty ✓');
    }catch(e){ toast('Kutsu tallennettu, mutta linkin lähetys epäonnistui: '+e.message); }
    naytaAsiakkaat();
  };
  $view.querySelectorAll('.asiakas').forEach(b=>b.onclick=()=>{
    const a=asiakkuudet.find(x=>String(x.id)===b.dataset.id);
    valittu={ id:a.asiakas_id, nimi:(a.asiakas_id&&nimet[a.asiakas_id])||a.email, email:a.email, tila:a.tila, asiakkuusId:a.id };
    viikkoMon=iso(mondayOf(new Date()));
    naytaAsiakas();
  });
  if(minaProfiili && minaProfiili.on_admin) naytaKayttajat();
}

/* Pieni trendiviiva liikkeen kehityksestä */
function sparkline(arvot){
  if(arvot.length<2) return '';
  const w=110,h=26,min=Math.min(...arvot),max=Math.max(...arvot);
  const span=(max-min)||1;
  const pts=arvot.map((v,i)=>((i/(arvot.length-1))*w).toFixed(1)+','+((h-3)-((v-min)/span)*(h-6)).toFixed(1)).join(' ');
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="flex:none"><polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

/* Koko historian kehitysnäkymä: liikekohtaiset trendit, viikkovolyymi, ennätykset */
async function naytaKehitys(){
  const a=valittu;
  const kehto=document.getElementById('kehitys');
  kehto.innerHTML='<div class="muted">Haetaan koko historiaa…</div>';
  let rivit=[], prs=[];
  try{
    rivit=await apiGet('sessions?select=pvm,data&user_id=eq.'+a.id+'&order=pvm');
    prs=await apiGet('prs?select=liike,paino,pvm&user_id=eq.'+a.id+'&order=pvm.desc');
  }catch(e){ kehto.innerHTML='<div class="muted">Haku epäonnistui — yritä hetken päästä uudelleen.</div>'; return; }
  if(!rivit.length){ kehto.innerHTML='<div class="muted">Ei vielä kirjauksia.</div>'; return; }

  const liikkeet={}, sarjatViikoittain={};
  for(const r of rivit){
    const s=r.data;
    let paivanSarjat=0;
    for(const e of Object.values(s.entries||{})){
      const st=(e.sets||[]).filter(x=>x.r!==''&&x.r!=null);
      if(!st.length) continue;
      paivanSarjat+=st.length;
      const painot=st.map(x=>parseFloat(x.w)).filter(v=>v>0);
      const arvo=painot.length?Math.max(...painot):Math.max(...st.map(x=>parseFloat(x.r)||0));
      const yks=painot.length?'kg':'toistoa/s';
      if(!(arvo>0)) continue;
      (liikkeet[e.name]=liikkeet[e.name]||{yks, pisteet:[]}).pisteet.push(arvo);
    }
    if(paivanSarjat){
      const ma=iso(mondayOf(fromIso(r.pvm)));
      sarjatViikoittain[ma]=(sarjatViikoittain[ma]||0)+paivanSarjat;
    }
  }

  let html='';
  const tamaMa=iso(mondayOf(new Date()));
  const viikot=[]; for(let i=7;i>=0;i--) viikot.push(addDays(tamaMa,-7*i));
  const maxSarjat=Math.max(1,...viikot.map(v=>sarjatViikoittain[v]||0));
  html+='<div class="muted" style="margin-bottom:4px">Sarjaa viikossa (8 vk):</div>'
    +'<div style="display:flex;align-items:flex-end;gap:4px;margin-bottom:12px">'
    +viikot.map(v=>{
      const n=sarjatViikoittain[v]||0;
      return '<div style="flex:1;text-align:center"><div style="margin:0 auto;width:70%;background:var(--accent);opacity:'+(n?'1':'0.15')+';height:'+Math.max(3,Math.round(n/maxSarjat*36))+'px;border-radius:3px 3px 0 0"></div>'
        +'<div class="muted" style="font-size:10px;margin-top:2px">'+(n||'')+'</div><div class="muted" style="font-size:10px">'+fmtFi(v)+'</div></div>';
    }).join('')+'</div>';

  const rows=Object.entries(liikkeet).filter(([,v])=>v.pisteet.length>=2)
    .sort((x,y)=>y[1].pisteet.length-x[1].pisteet.length).slice(0,15);
  if(rows.length){
    html+='<div class="muted" style="margin-bottom:2px">Liikekohtainen kehitys (paras sarja/kerta):</div>';
    for(const [nimi,v] of rows){
      const eka=v.pisteet[0], vika=v.pisteet[v.pisteet.length-1];
      const ero=Math.round((vika-eka)*10)/10;
      const eroTxt=ero===0?'ennallaan':((ero>0?'+':'')+ero+' '+v.yks+(v.yks==='kg'&&eka>0?' ('+(ero>0?'+':'')+Math.round(ero/eka*100)+'%)':''));
      html+='<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)">'
        +'<span style="flex:1;min-width:0"><b>'+esc(nimi)+'</b><br><span class="muted" style="font-size:12px">'
        +v.pisteet.length+' kirjausta · '+eka+' → '+vika+' '+v.yks+' · <span style="color:'+(ero>0?'var(--ok)':ero<0?'var(--varo)':'var(--muted)')+'">'+eroTxt+'</span></span></span>'
        +sparkline(v.pisteet.slice(-14))+'</div>';
    }
  } else html+='<div class="muted">Liikekohtaista kehitystä ei vielä ehdi näkyä — tarvitaan vähintään kaksi kirjausta samasta liikkeestä.</div>';

  if(prs.length){
    html+='<div class="muted" style="margin:12px 0 2px">Testatut ennätykset (1RM):</div>'
      +prs.slice(0,10).map(p=>'<div style="padding:6px 0;border-top:1px solid var(--line)"><b>'+esc(p.liike)+'</b> '+p.paino+' kg <span class="muted" style="font-size:12px">· '+fmtFi(p.pvm)+'</span></div>').join('');
  }
  kehto.innerHTML=html;
}

/* Jaksotus: sama logiikka kuin sovelluksen weekNum/isDeload, pilven treenisykli-rivistä */
function viikkoNro(sykli, mon){
  if(!sykli||!sykli.alku) return 0;
  const a=mondayOf(fromIso(sykli.alku)), b=fromIso(mon);
  return Math.floor((b-a)/(7*864e5))+1;
}
function onKevennys(sykli, mon){
  if(!sykli) return false;
  const w=viikkoNro(sykli, mon); if(w<=0) return false;
  const sr=sykli.siirrot||[];
  if(sr.some(s=>s.kohde===mon)) return true;
  if(sr.some(s=>s.alkup===mon)) return false;
  return w%(sykli.kevennys_vali||4)===0;
}
function kevennysBanneri(sykli, mon){
  if(!sykli) return '';
  const sr=sykli.siirrot||[];
  const tanne=sr.find(s=>s.kohde===mon), pois=sr.find(s=>s.alkup===mon);
  if(tanne) return '<div class="kevennys"><b>KEVENNYSVIIKKO</b> — siirretty tähän viikkoon (alun perin vko '+fmtFi(tanne.alkup)+'). Syy: '+esc(tanne.syy)+'</div>';
  if(pois) return '<div class="kevennys pois">Kevennysviikko siirretty '+(pois.suunta==='aikaisemmaksi'?'edelliselle':'seuraavalle')+' viikolle ('+fmtFi(pois.kohde)+'). Syy: '+esc(pois.syy)+'</div>';
  if(onKevennys(sykli, mon)) return '<div class="kevennys"><b>KEVENNYSVIIKKO</b> — ohjelman mukainen (joka '+(sykli.kevennys_vali||4)+'. viikko). Painot n. 65 %.</div>';
  return '';
}

/* Lihasryhmät. Viikkokuormituksessa päälihas = 1 sarja, avustava = ½ sarjaa. */
const LIHAKSET = [['etureidet','Etureidet'],['takareidet','Takareidet'],['pakarat','Pakarat'],['pohkeet','Pohkeet'],
  ['rinta','Rinta'],['selka','Selkä'],['olkapaat','Olkapäät'],['hauikset','Hauikset'],['ojentajat','Ojentajat'],
  ['keskivartalo','Keskivartalo']];
const LIHASN = Object.fromEntries(LIHAKSET);
/* Ehdotus liikkeen nimestä: [päälihas, avustava]. Järjestys ratkaisee: tarkat ensin. */
function arvaaLihas(nimi){
  const n=String(nimi||'').toLowerCase();
  if(!n.trim()) return ['',''];
  if(/lankku|vatsa|roikkumis/.test(n)) return ['keskivartalo',''];
  if(/pohje/.test(n)) return ['pohkeet',''];
  if(/ojentaja|ranskalainen|dippi/.test(n)) return ['ojentajat',''];
  if(/hauis|hammer|curl/.test(n)) return ['hauikset',''];
  if(/vipunosto|pystypunnerrus|arnold|pystysoutu|punnerrus istuen|olkap/.test(n)) return ['olkapaat', /punnerrus|arnold/.test(n)?'ojentajat':''];
  if(/penkki|rintapr|punnerrus/.test(n)) return ['rinta','ojentajat'];
  if(/selän ojennus|selan ojennus/.test(n)) return ['selka','pakarat'];
  if(/talja|leuanveto|soutu/.test(n)) return ['selka','hauikset'];
  if(/lantionnosto|hip thrust|loitonnus|pakara/.test(n)) return ['pakarat', /lantionnosto|hip thrust/.test(n)?'takareidet':''];
  if(/maastaveto|rdl|hyvää huomenta/.test(n)) return ['takareidet','pakarat'];
  if(/kyykky|prässi|prassi|hack/.test(n)) return ['etureidet','pakarat'];
  return ['',''];
}
function fmtS(n){ return n%1 ? n.toFixed(1).replace('.',',') : String(n); }
/* Liikkeen lihasryhmät: ohjelmaan merkityt, muuten ehdotus nimestä */
function liikkeenLihakset(x, nimi){
  if(x && x.lihas!==undefined) return [x.lihas||'', x.lihas2||''];
  return arvaaLihas(nimi || (x&&x.name));
}
function lihasTxt(x){
  const [a,b]=liikkeenLihakset(x, x.name);
  return a ? ' <span class="muted">· '+LIHASN[a]+(b?' (+'+LIHASN[b]+')':'')+'</span>' : '';
}
/* Ohjelma on tyhjä, jos siinä ei ole yhtään treenipäivää (salipäivä jossa liikkeitä,
   cardio, aktiviteetti tai vapaa treeni). Tyhjää ohjelmaa ei saa päätyä asiakkaalle. */
function ohjelmaTyhja(paivat){
  if(!paivat) return true;
  return !Object.values(paivat).some(p => p && (
    (p.type==='gym' && (p.ex||[]).some(e => e && e.name && String(e.name).trim())) ||
    p.type==='cardio' || p.type==='activity' || p.type==='free'));
}
/* Ohjelma vs. toteutunut -apurit */
function suunTxt(x){ return x.maxSet ? (x.sets+' × max') : (x.sets+' × '+x.min+'–'+x.max); }
function sarjaTxt(y){ return (y.w!==''&&y.w!=null?y.w+'kg':'')+'×'+y.r; }
function kirjatut(e){ return e ? (e.sets||[]).filter(y=>y.r!==''&&y.r!=null) : []; }
/* Viimeisin aiempi kerta, jolloin liike (ohjelman id) on kirjattu ennen annettua päivää */
function edellinenKerta(historia, id, pv){
  for(let i=historia.length-1;i>=0;i--){
    const r=historia[i];
    if(r.pvm>=pv) continue;
    const e=(r.data.entries||{})[id], st=kirjatut(e);
    if(st.length) return {pvm:r.pvm, nimi:e.name, txt:st.map(sarjaTxt).join(' · '), feel:e.feel};
  }
  return null;
}
function kokoOhjelmaHtml(ohj){
  if(!ohj||!ohj.paivat) return '';
  const vk={};
  for(const dk of DAYS){ const p=ohj.paivat[dk]; if(!p||p.type!=='gym') continue;
    for(const x of (p.ex||[])){ const [a,b]=liikkeenLihakset(x,x.name); const s=x.sets||0;
      if(a) vk[a]=(vk[a]||0)+s; if(b) vk[b]=(vk[b]||0)+s/2; } }
  const vkTxt=LIHAKSET.filter(([k])=>vk[k]).map(([k,n])=>n+' '+fmtS(vk[k])).join(' · ');
  return '<details class="ohj"><summary>Näytä asiakkaan koko ohjelma: '+esc(ohj.nimi||'')+'</summary>'
    +(vkTxt?'<div class="muted" style="font-size:12px;margin:8px 0">Ohjelman sarjat viikossa lihasryhmittäin: '+vkTxt+'</div>':'')
    +DAYS.map(dk=>{
      const p=ohj.paivat[dk]; if(!p) return '';
      return '<div class="paiva"><span class="pv">'+DOWFULL[dk]+' — '+esc(p.title||'')+'</span>'
        +(p.type==='gym'
          ? (p.ex||[]).map(x=>'<div class="liike"><b>'+esc(x.name)+'</b> '+suunTxt(x)+lihasTxt(x)
              +(x.alts&&x.alts.length?' <span class="muted">· vaihtoehdot: '+x.alts.map(a=>esc(a.name)).join(', ')+'</span>':'')+'</div>').join('')
          : '<div class="liike">'+esc(p.sub||p.type||'')+'</div>')
        +'</div>';
    }).join('')+'</details>';
}

function sessioTehty(s){
  if(!s) return false;
  if(s.done) return true;
  if(s.cardio && s.cardio.kesto) return true;
  return Object.values(s.entries||{}).some(e=>e.sets && e.sets.some(x=>x.r!=='' && x.r!=null));
}

async function naytaAsiakas(){
  const a=valittu;
  const loppu=addDays(viikkoMon,6);
  let rivit=[], kommentit=[], ohjelmalista=[], jako=null, sykli=null, historia=[], ohj=null, tyhjaMaaritys=false;
  try{
    if(a.id){
      try{ sykli=(await apiGet('treenisykli?select=alku,kevennys_vali,siirrot,updated_at,ohjelma&user_id=eq.'+a.id))[0]||null; }catch(e){}
      /* 12 viikon historia: tämän viikon kirjaukset + "edellinen kerta" jokaiselle liikkeelle */
      historia=await apiGet('sessions?select=pvm,data&user_id=eq.'+a.id+'&pvm=gte.'+addDays(viikkoMon,-84)+'&pvm=lte.'+loppu+'&order=pvm');
      rivit=historia.filter(r=>r.pvm>=viikkoMon);
      kommentit=await apiGet('comments?select=id,viikko,teksti,created_at&valmennettava_id=eq.'+a.id+'&viikko=eq.'+viikkoMon+'&order=created_at');
      ohjelmalista=await apiGet('ohjelmat?select=id,nimi&order=nimi');
      const j=await apiGet('ohjelma_jaot?select=ohjelma_id,jaettu&asiakas_id=eq.'+a.id);
      jako=j[0]||null;
      /* Asiakkaan ohjelma: ensisijaisesti se mikä sovelluksessa on oikeasti käytössä,
         muuten pilvestä määritetty */
      let maar=null;
      if(jako){
        try{ const o=(await apiGet('ohjelmat?select=nimi,data&id=eq.'+jako.ohjelma_id))[0];
          if(o&&o.data&&o.data.paivat){
            if(ohjelmaTyhja(o.data.paivat)) tyhjaMaaritys=true;
            else maar={nimi:o.nimi, paivat:o.data.paivat, lahde:'maaritys'};
          } }catch(e){}
      }
      if(sykli && sykli.ohjelma && sykli.ohjelma.paivat && !ohjelmaTyhja(sykli.ohjelma.paivat)) ohj={nimi:sykli.ohjelma.nimi, paivat:sykli.ohjelma.paivat, lahde:'sovellus'};
      else if(maar) ohj=maar;
    }
  }catch(e){ toast('Lataus epäonnistui: '+e.message); }
  const perPvm=Object.fromEntries(rivit.map(r=>[r.pvm,r.data]));

  /* viikon tunnusluvut */
  let tehty=0, sarjat=0, askeleet=0, askelPv=0, suunSarjat=0;
  const tyypit={};
  for(let i=0;i<7;i++){
    const s=perPvm[addDays(viikkoMon,i)];
    const sp=ohj&&ohj.paivat ? ohj.paivat[(s&&s.tmpl)||DAYS[i]] : null;
    if(sp && sp.type==='gym' && !(s&&s.skipped)) suunSarjat+=(sp.ex||[]).reduce((n,x)=>n+(x.sets||0),0);
    if(s && sp && sp.type==='gym'){
      const n=Object.values(s.entries||{}).reduce((m,e)=>m+kirjatut(e).length,0);
      if(n) tyypit[sp.title||'Sali']=(tyypit[sp.title||'Sali']||0)+n;
    }
    if(!s) continue;
    if(sessioTehty(s)) tehty++;
    for(const e of Object.values(s.entries||{})) sarjat+=(e.sets||[]).filter(x=>x.r!==''&&x.r!=null).length;
    if(s.steps){ askeleet+=parseInt(s.steps)||0; askelPv++; }
  }

  let html='<button class="ghost" id="takaisin">‹ Asiakkaat</button>'
    +'<div class="card"><div class="rivi"><h2 style="flex:1;margin:0">'+esc(a.nimi)+'</h2>'
    +'<select id="tilasel" style="width:auto">'
    +['kutsuttu','aktiivinen','tauolla','paattynyt'].map(t=>'<option'+(t===a.tila?' selected':'')+'>'+t+'</option>').join('')
    +'</select></div>'
    +'<div class="muted">'+esc(a.email)+'</div>'
    +(a.id?'':'<div class="muted" style="margin-top:8px;color:var(--accent)">Odottaa, että asiakas avaa sähköpostiinsa lähetetyn kirjautumislinkin — kirjaukset näkyvät tässä heti kun hän aloittaa.</div>')
    +'<button class="ghost" id="btnlahetalinkki" style="margin-top:10px;font-size:13px;padding:7px 12px">📧 Lähetä kirjautumislinkki asiakkaalle</button>'
    +'</div>';

  if(a.id){
    const jaettuNimi = jako && (ohjelmalista.find(o=>o.id===jako.ohjelma_id)||{}).nimi;
    html+='<div class="card"><h3>Treeniohjelma</h3>'
      +'<div class="muted" style="margin:4px 0 10px">'+(jaettuNimi
        ?('Käytössä: <b style="color:var(--text)">'+esc(jaettuNimi)+'</b> · jaettu '+fmtFi(jako.jaettu.slice(0,10)))
        :'Ei pilvestä määritettyä ohjelmaa — asiakkaalla on perusohjelma tai linkillä asennettu.')+'</div>'
      +(ohjelmalista.length
        ? '<div class="rivi"><select id="ohjsel" style="flex:1;width:auto">'
          +ohjelmalista.map(o=>'<option value="'+o.id+'"'+(jako&&jako.ohjelma_id===o.id?' selected':'')+'>'+esc(o.nimi)+'</option>').join('')
          +'</select><button class="primary" id="btnjaa" style="width:auto">Määritä</button></div>'
          +'<div class="muted" style="font-size:12px;margin-top:6px">Asiakkaan sovellus ottaa ohjelman käyttöön seuraavalla avauksella. Kun muokkaat ohjelmaa arkistossa, päivitys valuu asiakkaalle automaattisesti.</div>'
        : '<div class="muted">Pilviarkistossa ei ole vielä ohjelmia — tallenna ensin ohjelma <a href="/ohjelmaeditori.html" style="color:var(--accent)">editorissa</a>.</div>')
      +(tyhjaMaaritys
        ? '<div style="color:var(--paha);font-size:13px;margin-top:10px">⚠️ Määritetty ohjelma'+(jaettuNimi?' "'+esc(jaettuNimi)+'"':'')+' on tyhjä — siinä ei ole yhtään treenipäivää. Asiakkaan sovellus ei ota sitä käyttöön. Täydennä ohjelma editorissa ja tallenna arkistoon, tai määritä toinen ohjelma.</div>'
        : '')
      +(ohj
        ? '<div class="muted" style="font-size:12px;margin-top:10px">'+(ohj.lahde==='sovellus'
            ? 'Asiakkaan sovelluksessa on nyt käytössä: <b style="color:var(--text)">'+esc(ohj.nimi||'')+'</b>'
              +(jaettuNimi && jaettuNimi!==ohj.nimi ? ' — määrittämäsi ohjelma tulee käyttöön, kun asiakas avaa sovelluksen seuraavan kerran.' : '')
            : 'Näytetään määrittämäsi ohjelma. Asiakkaan sovellus ei ole vielä vahvistanut käyttöönottoa.')+'</div>'
          +kokoOhjelmaHtml(ohj)
        : '<div class="muted" style="font-size:12px;margin-top:10px">Asiakkaan ohjelmaa ei vielä tiedetä — se näkyy tässä, kun asiakas avaa päivitetyn sovelluksen kirjautuneena tai kun määrität ohjelman yllä.</div>')
      +'</div>';

    html+='<div class="card"><h3>📈 Kehitys</h3>'
      +'<div class="muted" style="margin:4px 0 8px">Koko historian liikekohtaiset trendit, viikkovolyymi ja ennätykset — ohjelman säätöä varten.</div>'
      +'<button class="ghost" id="btnkehitys">Näytä kehitys</button>'
      +'<div id="kehitys" style="margin-top:8px"></div></div>';

    /* Jaksotus: ohjelmaviikko, kevennysväli ja kevennysviikon siirrot syineen */
    const wNyt=viikkoNro(sykli, iso(mondayOf(new Date())));
    html+='<div class="card"><h3>🗓 Jaksotus</h3>';
    if(!sykli){
      html+='<div class="muted">Jaksotus ei ole vielä synkattu pilveen — asiakkaan sovellus lähettää sen seuraavalla avauksella kirjautuneena.</div>';
    } else {
      const sr=(sykli.siirrot||[]).slice().sort((x,y)=>String(y.kirjattu||'').localeCompare(String(x.kirjattu||'')));
      html+='<div class="muted">Ohjelma alkoi '+fmtFi(sykli.alku)+' · kevennysviikko joka '+(sykli.kevennys_vali||4)+'. viikko'
        +(wNyt>0?' · nyt <b style="color:var(--text)">ohjelmaviikko '+wNyt+'</b>':'')+'</div>';
      html+='<div class="muted" style="margin-top:8px">Kevennysviikon siirrot:</div>';
      if(!sr.length) html+='<div class="muted">Ei siirtoja.</div>';
      for(const s of sr){
        html+='<div class="siirto"><b>'+fmtFi(s.alkup)+' → '+fmtFi(s.kohde)+'</b> ('+(s.suunta==='aikaisemmaksi'?'aikaisemmaksi':'myöhemmäksi')+') · '+esc(s.syy)
          +(s.kirjattu?'<div class="muted" style="font-size:11px">kirjattu '+new Date(s.kirjattu).toLocaleDateString('fi-FI')+'</div>':'')+'</div>';
      }
    }
    html+='</div>';
  }

  const wViikko=viikkoNro(sykli, viikkoMon);
  html+='<div class="viikkonav"><button class="ghost" id="vprev">‹</button>'
    +'<h3>Viikko '+fmtFi(viikkoMon)+'–'+fmtFi(loppu)+(wViikko>0?' <span class="muted" style="font-weight:400">· ohjelmaviikko '+wViikko+'</span>':'')+'</h3>'
    +'<button class="ghost" id="vnext">›</button></div>';
  if(a.id) html+=kevennysBanneri(sykli, viikkoMon);

  if(a.id){
    html+='<div class="card"><div class="statgrid">'
      +'<div class="stat"><b>'+tehty+'</b><span>treeniä</span></div>'
      +'<div class="stat"><b>'+sarjat+(suunSarjat?'<span style="font-size:13px;color:var(--muted)"> / '+suunSarjat+'</span>':'')+'</b><span>'+(suunSarjat?'sarjaa tehty / ohjelmassa':'sarjaa')+'</span></div>'
      +'<div class="stat"><b>'+(askelPv?Math.round(askeleet/askelPv/100)/10+'k':'—')+'</b><span>askelta/pv</span></div>'
      +'<div class="stat"><b>'+rivit.length+'</b><span>kirjauspäivää</span></div>'
      +'</div>';
    if(Object.keys(tyypit).length) html+='<div class="muted" style="font-size:13px;margin-bottom:6px">Kuormitus tällä viikolla: '
      +Object.entries(tyypit).map(([t,n])=>'<b style="color:var(--text)">'+esc(t)+'</b> '+n+' sarjaa').join(' · ')+'</div>';
    /* Sarjat lihasryhmittäin: tehty (kirjatut) vs. ohjelmassa (suunnitellut) */
    const lSuun={}, lTehty={};
    const lisaaL=(o,l,n)=>{ if(l&&n) o[l]=(o[l]||0)+n; };
    for(let i=0;i<7;i++){
      const s=perPvm[addDays(viikkoMon,i)];
      const sp=ohj&&ohj.paivat ? ohj.paivat[(s&&s.tmpl)||DAYS[i]] : null;
      const exById={};
      if(sp && sp.type==='gym'){
        for(const x of (sp.ex||[])){
          exById[x.id]=x;
          if(!(s&&s.skipped)){ const [a,b]=liikkeenLihakset(x,x.name); lisaaL(lSuun,a,x.sets||0); lisaaL(lSuun,b,(x.sets||0)/2); }
        }
      }
      if(s) for(const [id,e] of Object.entries(s.entries||{})){
        const n=kirjatut(e).length; if(!n) continue;
        const [a,b]=liikkeenLihakset(exById[id], e.name); lisaaL(lTehty,a,n); lisaaL(lTehty,b,n/2);
      }
    }
    const lk=LIHAKSET.filter(([k])=>lSuun[k]||lTehty[k]);
    if(lk.length){
      const mx=Math.max(1,...lk.map(([k])=>Math.max(lSuun[k]||0,lTehty[k]||0)));
      html+='<div style="margin:8px 0 12px"><div class="muted" style="font-size:13px;margin-bottom:4px">Sarjat lihasryhmittäin — tehty'+(ohj?' / ohjelmassa':'')+':</div>'
        +lk.map(([k,n])=>{
          const t=lTehty[k]||0, su=lSuun[k]||0;
          return '<div class="lihasrivi"><span class="ln">'+n+'</span><span class="lb">'
            +'<span class="ls" style="width:'+Math.round(su/mx*100)+'%"></span>'
            +'<span class="lt" style="width:'+Math.round(t/mx*100)+'%"></span></span>'
            +'<span class="lv">'+fmtS(t)+(ohj?' / '+fmtS(su):'')+'</span></div>';
        }).join('')
        +'<div class="muted" style="font-size:11px;margin-top:4px">Päälihas = 1 sarja, avustava = ½. Jos liikkeelle ei ole merkitty lihasryhmää editorissa, se arvioidaan liikkeen nimestä.</div></div>';
    }

    const tanaan=iso(new Date());
    for(let i=0;i<7;i++){
      const pv=addDays(viikkoMon,i), s=perPvm[pv], dk=DAYS[i];
      const suun=ohj&&ohj.paivat ? ohj.paivat[(s&&s.tmpl)||dk] : null;
      const sali=!!(suun && suun.type==='gym' && (suun.ex||[]).length);
      html+='<div class="paiva"><div class="rivi"><span class="pv">'+DOWFULL[dk]+' '+fmtFi(pv)+'</span>'
        +(suun&&suun.title?'<span class="tila">'+esc(suun.title)+'</span>':'');
      if(s&&s.tmpl&&s.tmpl!==dk) html+='<span class="muted">siirretty treeni ('+DOWFULL[s.tmpl].toLowerCase()+')</span>';
      if(!s){
        html+='<span class="muted">— ei kirjausta'+(sali&&pv<tanaan?' (salipäivä)':'')+'</span></div>';
        if(sali) html+='<div class="liike" style="opacity:.75">Ohjelmassa: '+suun.ex.map(x=>esc(x.name)+' '+suunTxt(x)).join(' · ')+'</div>';
        html+='</div>'; continue;
      }
      if(s.skipped){ html+='<span class="muted">⊘ '+ (SKIPN[s.skipped]||'Ohitettu') +'</span></div></div>'; continue; }
      if(s.feel) html+='<span class="feel-tag feel-'+s.feel+'">'+FEELN[s.feel]+'</span>';
      if(s.steps) html+='<span class="muted">'+s.steps+' askelta</span>';
      const entries=s.entries||{}, nahty={};
      if(sali){
        const tehdyt=suun.ex.filter(x=>kirjatut(entries[x.id]).length).length;
        html+='<span class="muted">'+tehdyt+'/'+suun.ex.length+' liikettä kirjattu</span>';
      }
      html+='</div>';
      if(sali){
        /* Ohjelman jokainen liike näkyy — myös ne, joita ei kirjattu */
        for(const x of suun.ex){
          nahty[x.id]=true;
          const e=entries[x.id], st=kirjatut(e);
          const nimi=(e&&e.name)||x.name;
          const ed=edellinenKerta(historia, x.id, pv);
          html+='<div class="liike'+(st.length?'':' puuttuu')+'"><b>'+esc(nimi)+'</b>'
            +(nimi!==x.name?' <span class="muted">(vaihtoehto: '+esc(x.name)+')</span>':'')
            +' <span class="muted">· ohjelma '+suunTxt(x)+'</span><br>'
            +(st.length
              ? '✓ '+st.map(sarjaTxt).join(' · ')
                +(st.length<x.sets?' <span class="vajaa">('+st.length+'/'+x.sets+' sarjaa)</span>':'')
                +(st.length>x.sets?' <span class="muted">(+'+(st.length-x.sets)+' lisäsarja)</span>':'')
                +(e.feel?' <span class="feel-tag feel-'+e.feel+'">'+FEELN[e.feel]+'</span>':'')
              : '<span class="eikirjattu">— ei kirjattu</span>')
            +(ed?'<br><span class="muted" style="font-size:12px">Edellinen kerta '+fmtFi(ed.pvm)+(ed.nimi&&ed.nimi!==nimi?' ('+esc(ed.nimi)+')':'')+': '+ed.txt+(ed.feel?' · '+FEELN[ed.feel]:'')+'</span>':'')
            +'</div>';
        }
      }
      for(const [id,e] of Object.entries(entries)){
        if(nahty[id]) continue;
        const st=kirjatut(e);
        if(!st.length) continue;
        html+='<div class="liike"><b>'+esc(e.name)+'</b> '+st.map(sarjaTxt).join(' · ')
          +(e.feel?' <span class="feel-tag feel-'+e.feel+'">'+FEELN[e.feel]+'</span>':'')
          +(sali?' <span class="muted">(ei päivän ohjelmassa)</span>':'')+'</div>';
      }
      if(s.cardio && s.cardio.kesto) html+='<div class="liike"><b>'+esc(s.cardio.laji||'Cardio')+'</b> '+s.cardio.kesto+' min</div>';
      if(s.notes) html+='<div class="liike">📝 '+esc(s.notes)+'</div>';
      html+='</div>';
    }
    html+='</div>';

    html+='<div class="card"><h3>Kommentit tälle viikolle</h3>';
    if(!kommentit.length) html+='<div class="muted">Ei vielä kommentteja.</div>';
    for(const k of kommentit){
      html+='<div class="kommentti">'+esc(k.teksti)+'<div class="aika">'+new Date(k.created_at).toLocaleString('fi-FI')+'</div></div>';
    }
    html+='<textarea id="komteksti" rows="3" placeholder="Kirjoita palaute viikosta — asiakas näkee tämän sovelluksen Koti-sivulla" style="margin-top:8px"></textarea>'
      +'<button class="primary" id="btnkom" style="margin-top:8px">Lähetä kommentti</button></div>';
  }

  $view.innerHTML=html;
  document.getElementById('takaisin').onclick=naytaAsiakkaat;
  document.getElementById('vprev').onclick=()=>{ viikkoMon=addDays(viikkoMon,-7); naytaAsiakas(); };
  document.getElementById('vnext').onclick=()=>{ viikkoMon=addDays(viikkoMon,7); naytaAsiakas(); };
  const bl=document.getElementById('btnlahetalinkki');
  if(bl) bl.onclick=async()=>{
    bl.disabled=true;
    try{ await lahetaAsiakaslinkki(a.email); toast('Kirjautumislinkki lähetetty asiakkaalle ✓'); }
    catch(e){ toast('Lähetys epäonnistui: '+e.message); }
    bl.disabled=false;
  };
  document.getElementById('tilasel').onchange=async e=>{
    try{ await apiPatch('asiakkuudet?id=eq.'+a.asiakkuusId,{tila:e.target.value, paattyi: e.target.value==='paattynyt'?iso(new Date()):null});
      a.tila=e.target.value; toast('Tila päivitetty ✓'); }
    catch(err){ toast('Virhe: '+err.message); }
  };
  const bkeh=document.getElementById('btnkehitys');
  if(bkeh) bkeh.onclick=()=>{ bkeh.style.display='none'; naytaKehitys(); };
  const bj=document.getElementById('btnjaa');
  if(bj) bj.onclick=async()=>{
    try{
      /* Tyhjää ohjelmaa (ei treenipäiviä) ei saa määrittää asiakkaalle */
      const tark=(await apiGet('ohjelmat?select=nimi,data&id=eq.'+(+document.getElementById('ohjsel').value)))[0];
      if(!tark || !tark.data || ohjelmaTyhja(tark.data.paivat)){
        await vahvista('Ohjelmassa'+(tark?' "'+tark.nimi+'"':'')+' ei ole yhtään treenipäivää, joten sitä ei voi määrittää asiakkaalle.\n\nAvaa ohjelma editorissa, lisää treenipäivät ja liikkeet, ja tallenna arkistoon.','Selvä');
        return;
      }
      await apiPost('ohjelma_jaot?on_conflict=asiakas_id',
        {asiakas_id:a.id, ohjelma_id:+document.getElementById('ohjsel').value, jaettu:new Date().toISOString()},
        {Prefer:'resolution=merge-duplicates,return=minimal'});
      toast('Ohjelma määritetty ✓'); naytaAsiakas();
    }catch(e){ toast('Virhe: '+e.message); }
  };
  const bk=document.getElementById('btnkom');
  if(bk) bk.onclick=async()=>{
    const t=document.getElementById('komteksti').value.trim();
    if(!t){ toast('Kirjoita kommentti ensin'); return; }
    try{
      await apiPost('comments',{valmentaja_id:sbSession.user.id, valmennettava_id:a.id, viikko:viikkoMon, teksti:t},{Prefer:'return=minimal'});
      toast('Kommentti lähetetty ✓'); naytaAsiakas();
    }catch(e){ toast('Virhe: '+e.message); }
  };
}

/* ============ Käynnistys ============ */
(async function(){
  loadAuth(); handleAuthHash();
  if(!sbSession){ naytaKirjautuminen(); return; }
  const ok=await sbRefresh();
  if(!ok){ naytaKirjautuminen('Istunto vanhentui — kirjaudu uudelleen.'); return; }
  await sbUser();
  if(!cloudOn()){ naytaKirjautuminen('Kirjautuminen ei onnistunut.'); return; }
  document.getElementById('who').innerHTML=esc(sbSession.user.email)
    +'<br><a href="#" id="ulos">Kirjaudu ulos</a>';
  document.getElementById('ulos').onclick=e=>{ e.preventDefault(); sbSession=null; saveAuth(); location.reload(); };
  try{
    const p=await apiGet('profiles?select=id,nimi,rooli,on_admin&id=eq.'+sbSession.user.id);
    minaProfiili=p[0]||null;
  }catch(e){}
  if(!minaProfiili || (minaProfiili.rooli!=='valmentaja' && !minaProfiili.on_admin)){ naytaEiOikeuksia(); return; }
  naytaAsiakkaat();
})();
</script>
</body>
</html>
