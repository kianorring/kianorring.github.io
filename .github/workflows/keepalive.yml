name: Supabase-herate
# Pitaa ilmaistason Supabase-projektin hereilla (nukahtaa 7 pv kayttamattomyydesta).
# Kevyt REST-kutsu 2x viikossa kirjautuu seka API- etta tietokanta-aktiivisuudeksi.
# HUOM: GitHub poistaa ajastuksen kaytosta, jos repossa ei ole aktiivisuutta 60 paivaan
# - talloin Actions-valilehti nayttaa varoituksen ja ajastuksen voi kaynnistaa uudelleen napista.
on:
  schedule:
    - cron: '17 5 * * 1,4'   # ma ja to klo 05:17 UTC (~08:17 Suomen aikaa)
  workflow_dispatch:         # kasikaynnistys testausta varten

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: kia-norring-training
        run: |
          curl -sf "https://iroupwdszrboyjysjjcq.supabase.co/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: sb_publishable_Ud9cZaeyQ8TRth-_ALwvmA_PBlZmzGi" \
            -H "Authorization: Bearer sb_publishable_Ud9cZaeyQ8TRth-_ALwvmA_PBlZmzGi" \
            -o /dev/null -w "kia-norring-training: HTTP %{http_code}\n"
